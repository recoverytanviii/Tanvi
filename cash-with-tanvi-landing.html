<style>
  :root {
    --background: #0d0f1c;
    --foreground: #f2f3fa;
    --card: rgba(22, 25, 44, 0.88);
    --border: rgba(148, 158, 205, 0.24);
    --muted-foreground: #a9aec8;
    --primary: #3ba7e0;
    --primary-foreground: #101325;
    --secondary-foreground: #d5d9ea;
    --accent: #e77fb3;
    --radius: 1rem;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--background);
    color: var(--foreground);
    font-family: "Manrope", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .landing-shell {
    position: relative;
    isolation: isolate;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    overflow: hidden;
    padding: 3rem 1.25rem;
    background:
      radial-gradient(circle at 12% 4%, rgba(231, 127, 179, 0.14), transparent 34%),
      radial-gradient(circle at 88% 5%, rgba(59, 167, 224, 0.15), transparent 36%),
      linear-gradient(160deg, #0d0f1c, #0a0b16);
  }

  .ambient-light {
    position: absolute;
    width: 24rem;
    height: 24rem;
    border-radius: 9999px;
    filter: blur(90px);
    opacity: 0.15;
    pointer-events: none;
  }
  .ambient-light-left { left: -15rem; top: 8%; background: var(--accent); }
  .ambient-light-right { right: -16rem; bottom: 0; background: var(--primary); }

  .profile-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 25rem;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: calc(var(--radius) + 0.4rem);
    padding: 1.75rem 1.5rem;
    text-align: center;
    box-shadow: 0 28px 80px rgba(8, 10, 25, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: card-enter 650ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @media (min-width: 640px) {
    .profile-card { padding: 2rem 2rem; }
  }

  @keyframes card-enter {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .avatar-halo {
    margin: 0 auto;
    width: 7rem;
    height: 7rem;
    border-radius: 9999px;
    padding: 0.25rem;
    background: linear-gradient(135deg, var(--accent), var(--primary));
    box-shadow: 0 0 38px rgba(231, 127, 179, 0.28);
  }
  @media (min-width: 640px) { .avatar-halo { width: 8rem; height: 8rem; } }

  .avatar-halo img {
    width: 100%;
    height: 100%;
    border-radius: 9999px;
    object-fit: cover;
    display: block;
  }

  .eyebrow {
    margin-top: 1.25rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
  }

  h1 {
    margin-top: 0.5rem;
    font-size: clamp(1.55rem, 7vw, 2rem);
    font-weight: 800;
    line-height: 1.2;
    color: var(--foreground);
  }

  .subline {
    margin: 0.75rem auto 0;
    max-width: 20rem;
    font-size: 0.875rem;
    line-height: 1.5rem;
    color: var(--muted-foreground);
  }

  .telegram-button {
    margin-top: 1.5rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    height: 3rem;
    width: 100%;
    border-radius: 9999px;
    background: var(--primary);
    color: var(--primary-foreground);
    font-size: 0.875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-decoration: none;
    box-shadow: 0 10px 32px rgba(59, 167, 224, 0.28);
    transition: transform 200ms ease;
  }
  .telegram-button:hover { transform: translateY(-2px); }

  .telegram-button svg { width: 1rem; height: 1rem; }

  .trust-line {
    margin-top: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--secondary-foreground);
  }
  .trust-line svg { width: 1rem; height: 1rem; color: var(--accent); flex-shrink: 0; }

  .disclosure {
    margin-top: 1.25rem;
    border-top: 1px solid var(--border);
    padding-top: 1.25rem;
    text-align: left;
  }
  .disclosure-label {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted-foreground);
  }
  .disclosure-text {
    margin-top: 0.5rem;
    font-size: 0.72rem;
    line-height: 1.4rem;
    color: var(--muted-foreground);
  }

  @media (prefers-reduced-motion: reduce) {
    .profile-card { animation: none; }
    .telegram-button { transition: none; }
  }
</style>
</head>
